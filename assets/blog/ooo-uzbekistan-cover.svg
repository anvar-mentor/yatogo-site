      <circle cx="28" cy="25" r="13" fill="#0b7a5b"/>
      <text x="28" y="30" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text>
      <text x="50" y="31" font-size="17" font-weight="800" fill="#101619">Документы</text>
      <text x="18" y="57" font-size="12" fill="#647179">Устав и решение</text>
    </g>
    <g transform="translate(500 264)">
      <rect width="165" height="78" rx="18" fill="#fff" stroke="#c9ded5"/>
      <circle cx="28" cy="25" r="13" fill="#0b7a5b"/>
      <text x="28" y="30" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text>
      <text x="50" y="31" font-size="17" font-weight="800" fill="#101619">Регистрация</text>
