<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Этапы открытия ООО в Узбекистане</title>
  <desc id="desc">Фирменная дверь YATOGO и путь от ПИНФЛ до банковского счёта</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f6ef"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#31ae7d"/>
      <stop offset=".6" stop-color="#11805b"/>
      <stop offset="1" stop-color="#064b37"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#164d3c" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="720" height="520" rx="38" fill="url(#bg)"/>
  <path d="M55 62h610M55 130h610M55 198h610M55 266h610M55 334h610M55 402h610M55 470h610M104 34v452M202 34v452M300 34v452M398 34v452M496 34v452M594 34v452" stroke="#0b7a5b" stroke-opacity=".055"/>
