      <text x="28" y="30" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text>
      <text x="50" y="31" font-size="17" font-weight="800" fill="#101619">ПИНФЛ</text>
      <text x="18" y="57" font-size="12" fill="#647179">Идентификация</text>
    </g>
